      // Runs before paint: no flash of the wrong theme.

          var saved = localStorage.getItem("wk_theme");

          var theme = saved || (prefersLight ? "light" : "dark");

        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
